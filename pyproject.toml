[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-transformer-lab"
version = "0.1.0"
description = "A tested, modular decoder-only transformer implemented with PyTorch tensor operations to explore attention, training, and autoregressive generation from first principles."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nima Tehrani" },
]
dependencies = [
    "numpy>=2.5,<3",
    "torch>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
